name: Build release APK

# Manual trigger only. Builds the release APK unsigned; signing is done
# afterwards, off GitHub, with the Herder release keystore, which never
# leaves Brian's machines. A class-presence gate fails the run if the
# manifest's declared classes are missing from the built APK.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The version has ONE source: the herderVersion val in
      # app/build.gradle.kts. Read it here so the artifact and APK
      # names below can never drift from the app version (the old
      # artifact name was a hand-copied literal that every bump
      # had to remember to edit).
      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'val herderVersion = "\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "herderVersion not found in build.gradle.kts"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Herder version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle is installed by the official setup-gradle action, which
      # resolves the distribution and its checksum itself — no
      # hand-rolled download, and no hand-transcribed SHA-256 pin.
      # (The pin this replaced was wrong: its last 16 hex digits did
      # not match Gradle's published checksum for 8.10.2, so every
      # source "failed" the check. See the commit for the diagnosis.)
      # setup-gradle also manages the dependency cache, so there is
      # deliberately no separate actions/cache step for ~/.gradle.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release (unsigned)
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: Verify declared classes are in the APK
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          DEX="$ANDROID_HOME/build-tools/35.0.0/dexdump"
          for cls in "Lorg/bin/apk/herder/MainActivity;" "Lorg/bin/apk/herder/HerderApp;" "Lorg/bin/apk/herder/engine/ServerService;"; do
            if "$DEX" -f "$APK" 2>/dev/null | grep -q "$cls"; then
              echo "FOUND $cls"
            else
              echo "MISSING $cls"; exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package|targetSdkVersion"

      # The release file name carries the version and the ABI:
      # Herder-v<version>-arm64.apk (the app is arm64-only). The
      # Gradle output name (app-release-unsigned.apk) is generic —
      # two downloaded runs were indistinguishable by file name.
      - name: Name the APK for the release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/Herder-v${{ steps.version.outputs.version }}-arm64.apk"
          ls -la dist

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Herder-v${{ steps.version.outputs.version }}-arm64
          path: dist/Herder-v${{ steps.version.outputs.version }}-arm64.apk
          if-no-files-found: error
